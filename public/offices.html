<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EFE6DA">
<title>Your offices · Agent Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='8' fill='%23D97757'/%3E%3Crect x='5' y='5' width='1' height='3' fill='%23161616'/%3E%3Crect x='10' y='5' width='1' height='3' fill='%23161616'/%3E%3Crect x='4' y='11' width='2' height='2' fill='%23D97757'/%3E%3Crect x='10' y='11' width='2' height='2' fill='%23D97757'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="setup.css">
<style>
  .offices { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 8px; }
  .office { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 14px; background: rgba(255,255,255,.9); border: 1px solid rgba(0,0,0,.07); text-decoration: none; color: inherit; transition: box-shadow .15s, border-color .15s; }
  .office:hover { border-color: #C4633F; box-shadow: 0 4px 18px rgba(60,40,20,.1); color: inherit; }
  .office.here { box-shadow: inset 0 0 0 2px #1F1E1C; }
  .office h2 { margin: 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  .office .path { font: 400 11.5px/1.4 'Geist Mono', monospace; color: #8A867E; overflow-wrap: anywhere; margin: 4px 0 0; }
  .office .row1 { display: flex; align-items: center; gap: 12px; }
  .office .sw3 { display: flex; border-radius: 7px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); flex: none; }
  .office .sw3 i { width: 14px; height: 40px; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; }
  .stat { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 8px; background: #F3F1EC; font: 400 12px/1 'Geist Mono', monospace; color: #3A3833; font-variant-numeric: tabular-nums; }
  .stat::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: #9C9A94; }
  .stat.busy::before { background: #4C8DF6; } .stat.ok::before { background: #3FAE6A; } .stat.wait::before { background: #E5A93B; }
  .open { font-size: 13px; font-weight: 500; color: #C4633F; }
  .empty-state { max-width: 640px; margin: 24px auto; text-align: center; color: #55524C; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="./"><span class="logo" aria-hidden="true"></span>Agent Office</a>
  <a class="btn ghost" href="./">← This office</a>
</header>
<main id="main" tabindex="-1">
  <section class="hero small">
    <p class="eyebrow">Offices</p>
    <h1>Your offices</h1>
    <p class="lead">Every Agent Office running on this computer, one per project. Open one to watch that team.</p>
  </section>
  <div class="offices" id="offices" aria-live="polite"></div>
</main>
<script type="module" src="js/offices.js"></script>
</body>
</html>
